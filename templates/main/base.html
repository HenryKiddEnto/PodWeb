<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parasitoid Pod</title>
    {% load static %}
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Apply the saved collapsed state immediately, before the sidebar
         paints, so there's no visible flash of the expanded sidebar on
         every page load/navigation. -->
    <script>
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.body.classList.add('sidebar-collapsed');
        }
    </script>

    <div class="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Collapse/expand toggle -->
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Collapse sidebar" title="Collapse sidebar">
                ↔
            </button>

            <!-- Logo Container -->
            <a href="{% url 'home' %}" class="logo-link" title="Go to homepage">
                <div class="logo-container">
                    <img src="{% static 'images/GryonIcon.png' %}"
                         alt="{{ site_name }} Logo"
                         class="logo-image">
                </div>
            </a>
            <!-- Apps Section (Sidebar Buttons) -->
            <div class="apps-section">
                <div class="apps-title">Tools</div>
                {% for app in sidebar_apps %}
                <a href="{{ app.url }}" class="app-button" title="{{ app.name }}">
                    <span class="app-icon">{{ app.icon }}</span>
                    <span class="app-label">{{ app.name }}</span>
                </a>
                {% empty %}
                <!-- Default apps -->
                <a href="{% url 'typechallenge' %}" class="app-button" title="Type Challenge">
                    <span class="app-icon">🔥</span>
                    <span class="app-label">Type Challenge</span>
                </a>
                <a href="{% url 'wheel' %}" class="app-button" title="Teambuilding Wheel">
                    <span class="app-icon">🛞</span>
                    <span class="app-label">Teambuilding Wheel</span>
                </a>
                <a href="{% url 'builder' %}" class="app-button" title="Matchup Grid">
                    <span class="app-icon">🧮</span>
                    <span class="app-label">Matchup Grid</span>
                </a>
                <a href="{% url 'blog' %}" class="app-button" title="Pod Press">
                    <span class="app-icon">📰</span>
                    <span class="app-label">Pod Press</span>
                </a>
                <a href="{% url 'gallery' %}" class="app-button" title="Wasp Gallery">
                    <span class="app-icon">🐝</span>
                    <span class="app-label">Wasp Gallery</span>
                </a>
                {% endfor %}
            </div>
            <div class="footer">
                <p>&copy; 2026 Parasitoid Pod</p>
            </div>
        </div>
        <div class="main-content">
            <div class="content-card">
                {% block content %}
                <!-- Child templates will insert content here -->
                {% endblock %}
            </div>
        </div>
    </div>

    <script>
        (function() {
            var toggleBtn = document.getElementById('sidebarToggle');
            toggleBtn.addEventListener('click', function() {
                var isCollapsed = document.body.classList.toggle('sidebar-collapsed');
                localStorage.setItem('sidebarCollapsed', isCollapsed);
            });
        })();
    </script>
    <meta> {% csrf_token %}
</body>
</html>
